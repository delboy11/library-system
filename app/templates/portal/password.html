{% extends "base.html" %}
{% block title %}비밀번호 변경{% endblock %}
{% block content %}
<div class="page-head">
  <div class="page-head__text">
    <h1>비밀번호 변경</h1>
  </div>
</div>

<form method="post" class="form form--stack narrow">
  <label class="field">현재 비밀번호<input name="current" type="password" autocomplete="current-password" required autofocus></label>
  <label class="field">새 비밀번호<input name="new" type="password" autocomplete="new-password" required minlength="8" placeholder="8자 이상"></label>
  <label class="field">새 비밀번호 확인<input name="confirm" type="password" autocomplete="new-password" required minlength="8"></label>
  <div class="form__actions"><button class="btn btn--primary">변경</button></div>
</form>
{% endblock %}
